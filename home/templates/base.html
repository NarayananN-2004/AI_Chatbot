<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CHAT BOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    .ai-response-box h1, .ai-response-box h2, .ai-response-box h3 {
    margin-top: 1em;
    margin-bottom: 0.5em;
    font-weight: 600;
}
.ai-response-box strong {
    font-weight: 700;
}
.ai-response-box ul, .ai-response-box ol {
    margin-left: 1.5em;
}
.ai-response-box p {
    margin-bottom: 0.75em;
}

    body {
        margin: 0;
        min-height: 100vh;
        background: #b2ca18;
        position: relative;
         overflow-y: auto;
    }

    .bubble {
        position: absolute;
        bottom: -100px;
        width: 40px;
        height: 40px;
        background: rgb(255, 255, 255);
        border-radius: 50%;
        animation: rise 5s infinite ease-in;
    }
    @font-face {
        font-family:font1;
        src: url(./fonts_style/BBHSansBartle-Regular.ttf);
    }
    @font-face {
        font-family:font2;
        src: url(./fonts_style/Bungee-Regular.ttf);
    }
    @font-face {
        font-family:font3;
        src: url(./fonts_style/BBHSansBartle-Bold.ttf);
    }

    .bubble:nth-child(1) { left: 10%; width: 30px; height: 30px; animation-duration: 8s; }
    .bubble:nth-child(2) { left: 25%; width: 50px; height: 50px; animation-duration: 12s; animation-delay: 1s; }
    .bubble:nth-child(3) { left: 40%; width: 20px; height: 20px; animation-duration: 6s; animation-delay: 2s; }
    .bubble:nth-child(4) { left: 60%; width: 60px; height: 60px; animation-duration: 14s; animation-delay: 0s; }
    .bubble:nth-child(5) { left: 75%; width: 35px; height: 35px; animation-duration: 10s; animation-delay: 3s; }
    .bubble:nth-child(6) { left: 90%; width: 25px; height: 25px; animation-duration: 9s; animation-delay: 1.5s; }

     .bubble:nth-child(7) { left: 10%; width: 30px; height: 30px; animation-duration: 8s; }
    .bubble:nth-child(8) { left: 25%; width: 50px; height: 50px; animation-duration: 12s; animation-delay: 1s; }
    .bubble:nth-child(9) { left: 40%; width: 20px; height: 20px; animation-duration: 6s; animation-delay: 2s; }
    .bubble:nth-child(10) { left: 60%; width: 60px; height: 60px; animation-duration: 14s; animation-delay: 0s; }
    .bubble:nth-child(11) { left: 75%; width: 35px; height: 35px; animation-duration: 10s; animation-delay: 3s; }
    .bubble:nth-child(12) { left: 90%; width: 25px; height: 25px; animation-duration: 9s; animation-delay: 1.5s; }
    @keyframes rise {
        0%   { bottom: -100px; transform: translateX(0); opacity: 0; }
        50%  { opacity: 0.6; }
        100% { bottom: 110%; transform: translateX(50px); opacity: 0; }
    }

    .content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 20px;
    }
</style>

</head>
<body>

  <div class="content">
        {% block content %}
        {% endblock %}
    </div>
    

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    
  

</body>
</html>
